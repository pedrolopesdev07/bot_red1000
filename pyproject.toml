[project]
name = "redacao-enem-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.13,<2",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1",
  "google-genai>=1.0,<2", "python-json-logger>=2.0,<4",
  "redis>=5.2,<7", "arq>=0.26,<1", "itsdangerous>=2.2,<3",
  "email-validator>=2.2,<3", "stripe>=11,<14"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=0.24,<2", "aiosqlite>=0.20,<1"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
