name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redacao_test
          POSTGRES_PASSWORD: redacao_test
          POSTGRES_DB: redacao_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U redacao_test -d redacao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgresql+asyncpg://redacao_test:redacao_test@localhost:5432/redacao_test
      RUN_INFRASTRUCTURE_TESTS: "1"
      AUTH_DISABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: pytest -q
      - run: pip install pip-audit bandit
      - run: pip-audit
      - run: bandit -q -r app -x app/knowledge
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: docker compose config
